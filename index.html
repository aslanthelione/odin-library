<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <div class="sidebar">
    <form>
      <label for="title">Title: </label>
      <input type="text" name="title" id="title" required>
      <label for="author">Author: </label>
      <input type="text" name="author" id="author" required>
      <label for="pageCount">Pages: </label>
      <input type="text" inputmode="numeric" pattern="[1-9][0-9]*" name="pageCount" id="pageCount" required>
      <label for="hasRead">Read: </label>
      <input type="checkbox" name="hasRead" id="hasRead">
      <button id="add-book" type="submit">Add Book</button>
    </form>
  </div>
  <div id="cards">
  </div>
  <template id="card-template">
  <div class="card">
    <div class="info">
      <h2 class="title"></h2>
      <p class="author"></p>
      <p class="page-count"></p>
      <p class="has-read"></p>
    </div>
    <div class="card-actions">
      <button class="button-read" data-action="read">Read</button>
      <button class="button-delete" data-action="delete">Delete</button>
    </div>
  </div>
</template>
</body>

</html>
